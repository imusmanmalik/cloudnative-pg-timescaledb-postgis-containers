name: Update Catalogs

on:
  workflow_dispatch:
  repository_dispatch:
    types: [update-catalogs]

permissions: read-all

defaults:
  run:
    shell: "bash -Eeuo pipefail -x {0}"

jobs:
  update-catalogs:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.REPO_GHA_PAT }}

      - name: Gather supported distributions and imageTypes
        id: get_env
        run: |
          DISTROS=$(sed -n '/variable "distributions"/,/}/ { s/^[[:space:]]*"\([^"]*\)".*/\1/p }' docker-bake.hcl | paste -sd, -)
          IMAGE_TYPES=$(sed -n '/variable "imageTypes"/,/}/ { s/^[[:space:]]*"\([^"]*\)".*/\1/p }' docker-bake.hcl | paste -sd, -)
          echo "distributions=$DISTROS" >> "$GITHUB_OUTPUT"
          echo "image_types=$IMAGE_TYPES" >> "$GITHUB_OUTPUT"

      - name: Generate catalogs
        uses: cloudnative-pg/postgres-containers/.github/actions/generate-catalogs@main
        with:
          output-dir: image-catalogs/
          registry: ghcr.io/imusmanmalik/timescaledb-postgis
          family: timescaledb-postgis
          distributions: ${{ steps.get_env.outputs.distributions }}
          image-types: ${{ steps.get_env.outputs.image_types }}
          regex: '(\d+)(?:\.\d+|beta\d+|rc\d+|alpha\d+)-(\d+(?:\.\d+){1,3})-(\d{12})'

      - name: Diff
        run: |
          git add -A .
          git status
          git diff --staged

      # main requires signed commits and enforces that for admins too. The commit below
      # is unsigned, so lift admin enforcement for the push and restore it afterwards.
      - name: Temporarily disable "include administrators" branch protection
        if: ${{ github.ref == 'refs/heads/main' }}
        id: disable_include_admins
        env:
          GH_TOKEN: ${{ secrets.REPO_GHA_PAT }}
          PROTECTION: repos/${{ github.repository }}/branches/main/protection/enforce_admins
        run: |
          initial_status="$(gh api "$PROTECTION" --jq .enabled)"
          echo "initial_status=$initial_status" >> "$GITHUB_OUTPUT"
          if [ "$initial_status" = true ]; then
            gh api -X DELETE "$PROTECTION"
          fi

      - uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          add: 'image-catalogs/*.yaml'
          author_name: imusmanmalik
          author_email: usmanmalik@engineer.com
          message: 'chore: update imageCatalogs'

      - name: Enable "include administrators" branch protection
        if: ${{ always() && github.ref == 'refs/heads/main' && steps.disable_include_admins.outputs.initial_status == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.REPO_GHA_PAT }}
          PROTECTION: repos/${{ github.repository }}/branches/main/protection/enforce_admins
        run: gh api -X POST "$PROTECTION"
