name: Bake one PostgreSQL major

# Smoke-test the images of one PostgreSQL major, then bake and publish that major. The
# CNPG bake workflow has no hook for our tests and copies to production on every
# scheduled run, so the gate sits in front of it. One gate per major means a broken
# image holds back only its own major, and the other majors still get rebuilt.

on:
  workflow_call:
    inputs:
      postgresql_version:
        required: true
        type: string
      environment:
        required: true
        type: string
    secrets:
      SNYK_TOKEN:
        required: false

permissions: {}

jobs:
  # PRs skip this job because validate.yml already runs on them.
  smoke:
    name: Smoke test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yml
    with:
      postgresql_version: ${{ inputs.postgresql_version }}

  bake:
    name: Bake
    needs: smoke
    if: ${{ !failure() && !cancelled() }}
    permissions:
      packages: write
      contents: read
      id-token: write
      security-events: write
    uses: cloudnative-pg/postgres-containers/.github/workflows/bake_targets.yml@main
    with:
      environment: ${{ inputs.environment }}
      postgresql_version: ${{ inputs.postgresql_version }}
      target: postgis
      bake_files: ./source/docker-bake.hcl,./docker-bake.hcl
      bake_remote_source: cloudnative-pg/postgres-containers
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
