name: Validate

# Build every standard image (one per PostgreSQL major and distro) for amd64 and arm64
# without pushing, then run the smoke test with exact version assertions. Runs on PRs
# that change the build, and bake.yml calls it before any build that can publish.
# System images are not built here: they add only Barman Cloud from the CNPG base and
# share the same extension layer.

on:
  pull_request:
    paths:
      - Dockerfile
      - docker-bake.hcl
      - test/**
      - .github/workflows/validate.yml
  workflow_dispatch:
  workflow_call:

permissions: {}

defaults:
  run:
    shell: "bash -Eeuo pipefail -x {0}"

jobs:
  cells:
    name: List smoke targets
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch the CNPG source bake file
        run: |
          mkdir -p source
          curl -sSL https://raw.githubusercontent.com/cloudnative-pg/postgres-containers/main/docker-bake.hcl \
            -o source/docker-bake.hcl

      - name: List standard targets
        id: targets
        run: |
          targets="$(docker buildx bake -f source/docker-bake.hcl -f docker-bake.hcl --print postgis 2>/dev/null \
            | jq -c '[.target | keys[] | select(test("-standard-"))]')"
          test "$(echo "$targets" | jq length)" -gt 0
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  smoke:
    name: Smoke ${{ matrix.target }} ${{ matrix.arch }}
    needs: cells
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.cells.outputs.targets) }}
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch the CNPG source bake file
        run: |
          mkdir -p source
          curl -sSL https://raw.githubusercontent.com/cloudnative-pg/postgres-containers/main/docker-bake.hcl \
            -o source/docker-bake.hcl

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Resolve pins and image tag for ${{ matrix.target }}
        id: pins
        env:
          TARGET: ${{ matrix.target }}
        run: |
          spec="$(docker buildx bake -f source/docker-bake.hcl -f docker-bake.hcl --print "$TARGET" 2>/dev/null)"
          get() { echo "$spec" | jq -r --arg t "$TARGET" ".target[\$t]$1"; }
          # apt pin -> extension version: strip the epoch (1:) and the Debian suffix (~... or -...)
          {
            echo "expected_timescaledb=$(get '.args.TIMESCALEDB_VERSION' | sed 's/~.*//')"
            echo "expected_toolkit=$(get '.args.TIMESCALEDB_TOOLKIT_VERSION' | sed 's/^[0-9]*://; s/~.*//')"
            echo "expected_postgis=$(get '.args.POSTGIS_VERSION' | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')"
            echo "expected_pgrouting=$(get '.args.PGROUTING_VERSION' | sed 's/-.*//')"
            echo "tag=$(get '.tags[0]')"
          } >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.target }} (${{ matrix.arch }}, load)
        run: |
          # Without provenance and SBOM the build is a single manifest, which the docker
          # exporter behind --load needs. The target's attestations make a manifest list.
          docker buildx bake -f source/docker-bake.hcl -f docker-bake.hcl "${{ matrix.target }}" \
            --set '*.platform=linux/${{ matrix.arch }}' \
            --set '*.output=type=docker' \
            --provenance=false --sbom=false \
            --load

      - name: Smoke test with strict version assertions
        env:
          EXPECTED_TIMESCALEDB: ${{ steps.pins.outputs.expected_timescaledb }}
          EXPECTED_TOOLKIT: ${{ steps.pins.outputs.expected_toolkit }}
          EXPECTED_POSTGIS: ${{ steps.pins.outputs.expected_postgis }}
          EXPECTED_PGROUTING: ${{ steps.pins.outputs.expected_pgrouting }}
        run: |
          bash test/smoke.sh "${{ steps.pins.outputs.tag }}"
