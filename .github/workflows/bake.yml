name: Bake Images

on:
  schedule:
    # Rebuild weekly against the current CNPG base images, on Mondays
    - cron: 0 10 * * 1
  pull_request:
    # Only run the full matrix build when something build-affecting changes; trivial
    # PRs (docs, other workflow files, action-SHA bumps) should not spawn 18 builds.
    paths:
      - Dockerfile
      - docker-bake.hcl
      - .github/workflows/bake.yml
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options:
          - testing
          - production
        default: testing
        description: "Choose the environment to bake the target for"

permissions: {}

jobs:
  get_versions:
    name: Get PostgreSQL versions
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.get_versions.outputs.versions }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch the CNPG source bake file
        run: |
          mkdir -p source
          curl -sSL https://raw.githubusercontent.com/cloudnative-pg/postgres-containers/main/docker-bake.hcl \
            -o source/docker-bake.hcl

      - name: Get supported PostgreSQL versions
        id: get_versions
        run: |
          # Read the majors from the targets bake will build. That is the intersection of
          # the CNPG versions and our TimescaleDB pins, so a major that either side drops
          # (PostgreSQL 14 at end of life, a preview without TimescaleDB) gets no leg. An
          # empty leg would run bake with no targets, which falls back to the default group.
          VERSIONS="$(docker buildx bake -f source/docker-bake.hcl -f docker-bake.hcl --print postgis 2>/dev/null \
            | jq -r '[.target[].args.PG_MAJOR] | unique | map(tonumber) | sort | join(",")')"
          test -n "$VERSIONS"
          echo "PostgreSQL versions: [$VERSIONS]"
          echo "versions=[$VERSIONS]" >> "$GITHUB_OUTPUT"

  # The reusable bake workflow copies to production on every schedule run and has no hook
  # for our own tests, so the smoke test has to pass before it is called. PRs skip this
  # job because validate.yml already runs on them.
  smoke:
    name: Smoke test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yml

  Bake:
    name: Bake
    needs:
      - get_versions
      - smoke
    if: ${{ !failure() && !cancelled() }}
    permissions:
      packages: write
      contents: read
      id-token: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.get_versions.outputs.versions) }}
    uses: cloudnative-pg/postgres-containers/.github/workflows/bake_targets.yml@main
    with:
      # inputs.environment is null on pull_request/schedule; the reusable workflow
      # requires it. Default to testing - production promotion is gated separately on
      # event_name == schedule / explicit production dispatch.
      environment: ${{ github.event.inputs.environment || 'testing' }}
      postgresql_version: ${{ matrix.version }}
      target: "postgis"
      bake_files: "./source/docker-bake.hcl,./docker-bake.hcl"
      bake_remote_source: "cloudnative-pg/postgres-containers"
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  Catalogs:
    name: Update Catalogs
    needs: Bake
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    if: |
      github.ref == 'refs/heads/main' &&
      ( github.event.inputs.environment == 'production' || github.event_name == 'schedule' )
    steps:
      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          event-type: update-catalogs
